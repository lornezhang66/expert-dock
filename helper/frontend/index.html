<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>专家云盘小助手</title>
<style>
  /* ============ 设计令牌 ============
     品牌渐变 135deg：#1677FF → #26C69D（与产品图标同源）
     中性色阶：#17181C 主文本 / #5A6072 正文 / #878E99 次要 / #ECEEF2 线 / #F6F7F9 卡片 */
  :root {
    --brand-a: #1677FF;
    --brand-b: #26C69D;
    --ink: #17181C;
    --ink-2: #5A6072;
    --ink-3: #878E99;
    --line: #ECEEF2;
    --card: #F6F7F9;
    --ok: #22A06B;
    --busy: #1677FF;
    --bad: #D93A2B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background: #FFFFFF; color: var(--ink);
    user-select: none; cursor: default; overflow: hidden;
    display: flex;
  }
  main { flex: 1; display: flex; flex-direction: column; padding: 22px 22px 18px; min-width: 0; }

  /* ---- 品牌头部 ---- */
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    box-shadow: 0 2px 10px rgba(22, 119, 255, .18), 0 1px 2px rgba(23, 24, 28, .08);
  }
  .titles h1 { font-size: 16px; font-weight: 700; letter-spacing: .2px; line-height: 1.3; }
  .titles .sub { margin-top: 3px; font-size: 12px; color: var(--ink-3); letter-spacing: .1px; }
  .titles .sub b { color: var(--ink-2); font-weight: 600; }

  /* ---- 状态卡 ---- */
  .status-card {
    margin-top: 18px; background: var(--card); border-radius: 12px;
    padding: 13px 16px 14px; min-height: 86px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; transition: background .2s; }
  .dot.busy { background: var(--busy); animation: pulse 1.4s ease-in-out infinite; }
  .dot.bad  { background: var(--bad); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22, 119, 255, .35); }
    50%      { box-shadow: 0 0 0 5px rgba(22, 119, 255, 0); }
  }
  .state { font-size: 13px; font-weight: 600; }
  .msg { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); word-break: break-all; }

  .progress {
    margin-top: 4px; height: 4px; border-radius: 3px; background: #E9ECF1;
    overflow: hidden; display: none;
  }
  .progress.show { display: block; }
  .bar {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, var(--brand-a), var(--brand-b));
    transition: width .18s ease-out;
  }
  .bar.indeterminate {
    width: 40% !important;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { margin-left: -40%; }
    100% { margin-left: 100%; }
  }

  /* ---- 底部操作区 ---- */
  footer { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 14px; }
  .flex { flex: 1; }
  .btn {
    height: 34px; padding: 0 16px; border-radius: 10px; border: none;
    font: 600 12.5px/1 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    cursor: pointer; transition: filter .15s, background .15s, border-color .15s, color .15s;
    letter-spacing: .2px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    color: #fff; background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.primary:disabled { filter: grayscale(.35) brightness(.96); cursor: default; transform: none; }
  .btn.ghost {
    color: var(--ink); background: #fff; border: 1px solid #E3E6EA;
  }
  .btn.ghost:hover { background: #F2F4F7; border-color: #D8DCE2; }
  .btn.text { color: var(--ink-3); background: transparent; }
  .btn.text:hover { color: var(--ink); }

  /* ---- 通知 toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translate(-50%, 8px);
    background: rgba(23, 24, 28, .92); color: #fff; font-size: 12.5px;
    padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 85%;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="logo" src="/assets/icon.png" alt="">
    <div class="titles">
      <h1>专家云盘小助手</h1>
      <p class="sub">版本 <b id="ver">…</b> · WorkBuddy 本地安装器</p>
    </div>
  </header>

  <section class="status-card">
    <div class="row">
      <span class="dot" id="dot"></span>
      <span class="state" id="state">正在就绪…</span>
    </div>
    <p class="msg" id="msg">正在同步专家 MCP 配置</p>
    <div class="progress" id="progress"><div class="bar indeterminate" id="bar"></div></div>
  </section>

  <footer>
    <button class="btn primary" id="btnUpdate">检查更新</button>
    <button class="btn ghost" id="btnSync">同步 MCP 配置</button>
    <span class="flex"></span>
    <button class="btn text" id="btnQuit">退出</button>
  </footer>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const els = {
  dot: $("dot"), state: $("state"), msg: $("msg"),
  progress: $("progress"), bar: $("bar"), toast: $("toast"), ver: $("ver"),
};

// 状态机：ready(绿) / installing|updating(蓝+脉冲+进度条) / failed(红)
function applyStatus(data) {
  const state = data.state || "ready";
  const message = data.message || "";
  const busy = state === "installing" || state === "updating";
  els.dot.className = "dot" + (state === "failed" ? " bad" : busy ? " busy" : "");
  els.state.textContent = busy ? "正在处理" : state === "failed" ? "出现问题" : "就绪";
  els.msg.textContent = message;
  els.progress.classList.toggle("show", busy);
  if (busy) {
    els.bar.classList.add("indeterminate");
  } else {
    els.bar.classList.remove("indeterminate");
    els.bar.style.width = "0%";
  }
}

function applyProgress(data) {
  if (!data || !(data.total > 0)) return;
  els.progress.classList.add("show");
  els.bar.classList.remove("indeterminate");
  els.bar.style.width = Math.min(100, Math.round((data.done / data.total) * 100)) + "%";
}

let toastTimer = null;
function showToast(text) {
  els.toast.textContent = text;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 3200);
}

// 等待 wails 运行时注入（生产构建注入先于脚本执行，此处兜底防御）
function whenReady(fn, attempt) {
  if (window.go && window.go.main && window.go.main.App && window.runtime) return fn();
  if (attempt > 50) { els.msg.textContent = "界面运行时初始化失败，请重启小助手"; return; }
  setTimeout(() => whenReady(fn, (attempt || 0) + 1), 100);
}

whenReady(() => {
  const app = window.go.main.App;
  window.runtime.EventsOn("ui:status", applyStatus);
  window.runtime.EventsOn("ui:progress", applyProgress);
  window.runtime.EventsOn("ui:notify", (text) => showToast(text));

  app.GetVersion().then((v) => { els.ver.textContent = v; }).catch(() => {});

  $("btnUpdate").addEventListener("click", () => { app.CheckUpdate().catch(showToast); });
  $("btnSync").addEventListener("click", () => { app.SyncMcp().catch(showToast); });
  $("btnQuit").addEventListener("click", () => { app.Quit(); });
});
</script>
</body>
</html>
