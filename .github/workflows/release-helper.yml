name: Release Helper
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_BASE: ${{ vars.EXPERTDOCK_API_BASE }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build macOS app
        working-directory: helper
        run: |
          BASE="${API_BASE:-https://expert-dock.workers.dev}"
          mkdir -p "dist/ExpertDock Helper.app/Contents/MacOS"
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.apiBase=$BASE" -o dist/helper-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.apiBase=$BASE" -o dist/helper-amd64 .
          lipo -create dist/helper-arm64 dist/helper-amd64 -output "dist/ExpertDock Helper.app/Contents/MacOS/expertdock-helper"
          cp Info.plist "dist/ExpertDock Helper.app/Contents/Info.plist"
          cd dist && zip -r expertdock-helper-macos.zip "ExpertDock Helper.app"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-macos
          path: helper/dist/expertdock-helper-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build Windows helper
        working-directory: helper
        shell: pwsh
        run: |
          $base = if ($env:API_BASE) { $env:API_BASE } else { "https://expert-dock.workers.dev" }
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-s -w -X main.apiBase=$base" -o dist/expertdock-helper.exe .
          '@echo off
          "%~dp0expertdock-helper.exe" --install-protocol
          pause' | Set-Content -Encoding ascii dist/install.cmd
          Compress-Archive -Path dist/expertdock-helper.exe,dist/install.cmd -DestinationPath dist/expertdock-helper-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: helper-windows
          path: helper/dist/expertdock-helper-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
