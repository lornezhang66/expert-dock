name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 生产以 worker/index.js（esbuild bundle）为事实源，--no-bundle 直接部署；src/ TS 已移除（见 docs/ARCHITECTURE.md）
      - run: npx wrangler deploy --dry-run --no-bundle

  helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: helper/go.mod
      - run: gofmt -w main.go && git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
